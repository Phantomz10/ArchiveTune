name: Build Nightly APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nightly:
    name: Build Nightly APK (gms-mobile-arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Nightly APK
        run: ./gradlew assembleGmsMobileArm64Nightly
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Resolve nightly output directory
        id: nightly_dir
        shell: bash
        run: |
          set -euo pipefail
          FOUND="$(find app/build/outputs/apk -type d -iname 'nightly' | head -n 1 || true)"
          if [ -z "$FOUND" ]; then
            echo "Could not find nightly output directory"
            find app/build/outputs/apk -maxdepth 6 -type d -print || true
            exit 1
          fi
          echo "nightly_dir=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Sign Nightly APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.nightly_dir.outputs.nightly_dir }}/
          signingKey: ${{ secrets.NIGHTLY_KEYSTORE }}
          keyAlias: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Upload signed Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-nightly
          path: ${{ steps.nightly_dir.outputs.nightly_dir }}/*.apk
